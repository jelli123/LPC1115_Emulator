# ================================================================
# Board-Profil: Selfbus IO-8x fused 35x25 FM (RP2354A)
# Wird verwendet, solange im Flash keine gespeicherte Konfiguration
# liegt (frisches Board, 'cfg clear'). Syntax wie CONFIG.INI.
#
# Zuordnung LPC1115-Pin -> Signal aus dem LPC-Vorgaenger (Eagle-
# Schaltplan IOmodule-8x_fused_35x25_fm.sch), RP-GPIO aus der KiCad-
# Netzliste der RP2354-Version.
# ================================================================

autostart=on

# --- Kanaele IO1..IO8 (X3 IN1..IN8) -------------------------------
# Achtung: IO6/IO7 sind auf der RP-Platine gegenueber IN6/IN7 gekreuzt
# (IO6 -> X3.9 = IN7, IO7 -> X3.8 = IN6), genau wie im LPC-Original.
pin.3_4=27
pin.0_3=28
pin.2_5=26
pin.0_7=22
pin.3_5=21
pin.2_1=20
pin.0_6=6
pin.2_9=11

# --- Prog-Taster/-LED (JP8, low-aktiv) ----------------------------
pin.2_0=2

# --- KNX (JP3): EIB_IN = CT16B1_CAP0 (P1_8), EIB_OUT = CT16B1_MAT0 (P1_9)
tcap_pio=on
tmatch_pio=on
tcap.1=25
tmat.1.0=24

# --- Busspannung BUS_V = AD7 (P1_11) -> GP29 (RP-ADC3) ------------
# AD0..AD3 abgeschaltet: GP26..28 sind hier digitale IO-Kanaele.
adc_bridge_en=on
adc.0=-1
adc.1=-1
adc.2=-1
adc.3=-1
adc.7=29

# --- I2C (P0_4 SCL, P0_5 SDA) -> i2c1 GP19/GP18 (FRAM FM24CL64B) ---
i2c_bridge_en=on
i2c_bridge_inst=1
i2c_bridge_sda=18
i2c_bridge_scl=19
i2c_bridge_hz=400000

# --- UART0 (P1_7 TXD, P1_6 RXD) -> uart0 GP16/GP17 (JP7 ISP_TXD/RXD)
uart0_tx=16
uart0_rx=17

# --- ISP wie beim echten LPC: ISP_EN (P0_1, JP7.7) beim Reset low ---
# -> emulierter LPC-ISP ueber ISP_TXD/ISP_RXD (FlashMagic, lpc21isp,
# Selfbus-Programmer). RESET (JP7.10) ist der RUN-Pin des RP2354 und
# startet den ganzen Emulator neu (reset_in nicht noetig).
pin.0_1=23
isp_pins=on
isp_baud=0
reset_in=off

# Bootloader + Applikation (Selfbus-Standard)
app_start=0x3000
autodesc=on
